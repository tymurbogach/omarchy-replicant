# Every suite, on every pull request and on every push to main. The
# environment is tests/Dockerfile, the same one a person can run locally.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version format and monotonicity
        run: bash tests/check-version-bump.sh
      - name: Check pull request carries a version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          bash tests/check-version-bump.sh --base "origin/${{ github.base_ref }}"
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the test image
        run: docker build -f tests/Dockerfile -t replicant-tests .
      - name: Run every suite
        run: docker run --rm replicant-tests
